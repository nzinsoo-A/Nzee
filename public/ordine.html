<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>La tua prenotazione 🐾</title>
    <meta name="robots" content="noindex" />
    <meta name="referrer" content="no-referrer" />
    <meta name="theme-color" content="#f0568f" />
    <link rel="icon" href="/img/paw.svg" type="image/svg+xml" />
    <link rel="preload" href="/fonts/fredoka.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/nunito.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="/css/style.css" />
    <script type="module" src="/js/ordine.js"></script>
  </head>
  <body>
    <header class="site-header">
      <div class="container header-inner">
        <a class="brand" href="/">
          <svg class="brand-logo" aria-hidden="true"><use href="/img/icons.svg#paw-heart" /></svg>
          <span data-bind="title">Lotteria Zampette</span>
        </a>
        <a class="btn btn-sm btn-secondary" href="/">
          <svg class="icon" aria-hidden="true"><use href="/img/icons.svg#arrow-left" /></svg>
          <span class="cta-long">Torna ai numeri</span><span class="cta-short">Numeri</span>
        </a>
      </div>
    </header>

    <main id="order-root">
      <div class="state-page container" id="order-loading">
        <svg class="big-paw" aria-hidden="true"><use href="/img/icons.svg#paw" /></svg>
        <p class="muted">Sto caricando la tua prenotazione…</p>
      </div>
    </main>

    <footer class="site-footer">
      <div class="container footer-inner">
        <div class="footer-brand">
          <svg class="icon" aria-hidden="true"><use href="/img/icons.svg#paw-heart" /></svg>
          <span data-bind="organization">Lotteria Zampette</span>
        </div>
        <nav class="footer-links" aria-label="Link utili">
          <span data-bind="contact" hidden><a href="#">Contattaci</a></span>
          <a href="/privacy">Privacy</a>
        </nav>
        <p class="footer-note">
          © <span data-bind="year">2026</span> · Lotteria di beneficenza · Con amore, da tante zampette
          <svg class="icon inline-paw" aria-hidden="true"><use href="/img/icons.svg#paw" /></svg>
        </p>
      </div>
    </footer>
  </body>
</html>
